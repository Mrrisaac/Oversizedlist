<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oversized Vehicles List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .search-container {
      text-align: center;
      margin-bottom: 30px;
    }
    input[type="text"] {
      width: 300px;
      padding: 10px;
      font-size: 16px;
    }
    select {
      padding: 10px;
      font-size: 16px;
    }
    h2 {
      background-color: #333;
      color: #fff;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    ul {
      list-style-type: none;
      padding-left: 15px;
      display: none;
    }
    li {
      background-color: #fff;
      margin-bottom: 5px;
      padding: 8px 12px;
      border-radius: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
    }
    li img {
      height: 60px;
      margin-right: 15px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Oversized Vehicles List</h1>
  <!-- Content omitted for brevity -->
  <script>
    function toggleList(header) {
      const ul = header.nextElementSibling;
      ul.style.display = ul.style.display === 'block' ? 'none' : 'block';
    }
    const searchBox = document.getElementById('searchBox');
    const brandFilter = document.getElementById('brandFilter');
    const vehicleList = document.getElementById('vehicleList');
    function filterList() {
      const query = searchBox.value.toLowerCase();
      const brand = brandFilter.value;
      const uls = vehicleList.querySelectorAll('ul');
      uls.forEach(ul => {
        const brandMatches = !brand || ul.getAttribute('data-brand') === brand;
        let matchFound = false;
        ul.querySelectorAll('li').forEach(li => {
          const text = li.textContent.toLowerCase();
          const matches = text.includes(query);
          li.style.display = matches ? 'flex' : 'none';
          if (matches) matchFound = true;
        });
        ul.style.display = brandMatches && matchFound ? 'block' : 'none';
        ul.previousElementSibling.style.display = brandMatches && matchFound ? 'block' : 'none';
      });
    }
    searchBox.addEventListener('input', filterList);
    brandFilter.addEventListener('change', filterList);
  </script>
</body>
</html>
